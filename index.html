<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Jamie Buttenshaw — Website Moved</title>
    <meta name="description" content="This website has moved to jamiebuttenshaw.com">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232FBADC'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='58' font-weight='bold' text-anchor='middle' fill='%231a1a1a'%3EJ%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --muted: #a3a3a3;
            --accent: #2FBADC;
            --on-accent: #1a1a1a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --text: #333333;
                --muted: #666666;
                --accent: #0099cc;
                --on-accent: #ffffff;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: 'Noto Sans', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }

        main {
            max-width: 30rem;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            line-height: 1.2;
        }

        .sub {
            margin-top: 1rem;
            font-size: 1.125rem;
            line-height: 1.7;
            color: var(--muted);
        }

        .big-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            margin-top: 2.75rem;
            padding: 1rem 2.25rem;
            border-radius: 8px;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            font-weight: 700;
            color: var(--on-accent);
            background-color: var(--accent);
            text-decoration: none;
            transition: filter 0.2s ease;
        }

        .big-link:hover {
            filter: brightness(0.93);
        }

        .big-link:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .big-link svg {
            width: 1.1em;
            height: 1.1em;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <main>
        <h1>This website has moved</h1>
        <p class="sub">
            Jamie Buttenshaw&rsquo;s new website is live. Follow the link below to continue.
        </p>
        <a class="big-link" href="https://jamiebuttenshaw.com">
            <span>jamiebuttenshaw.com</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <polyline points="13 5 20 12 13 19"></polyline>
            </svg>
        </a>
    </main>
</body>
</html>
